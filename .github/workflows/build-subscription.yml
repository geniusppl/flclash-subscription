name: Build FlClash subscription

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions scheduled workflows have a 5-minute minimum; use 15 minutes.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: build-flclash-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start local subscription converter
        run: |
          docker pull ghcr.io/jungley8/subconverter-ng:latest
          docker run -d --name subconverter -p 127.0.0.1:25500:25500 ghcr.io/jungley8/subconverter-ng:latest
          sleep 5

      - name: Convert recommended upstream public node lists to Mihomo YAML
        env:
          SOURCE_URL: "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/1.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/6.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/22.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/23.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/24.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/25.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/26.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/27.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/28.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/29.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/30.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/31.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/32.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/33.1.txt|https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/34.txt"
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error --get \
              --data-urlencode 'target=clash' \
              --data-urlencode "url=${SOURCE_URL}" \
              http://127.0.0.1:25500/sub \
              --output flclash.yaml; then
              break
            fi
            echo "Converter not ready; retry ${i}/15"
            sleep 2
          done
          test -s flclash.yaml
          grep -q '^proxies:' flclash.yaml

      - name: Add selectable proxy group and default route
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import yaml

          path = "flclash.yaml"
          with open(path, encoding="utf-8") as f:
              config = yaml.safe_load(f) or {}
          proxies = config.get("proxies") or []
          if not proxies:
              raise SystemExit("Converted configuration contains no proxies")

          # Mihomo proxy-group members must have unique names.
          seen = set()
          names = []
          for index, proxy in enumerate(proxies, start=1):
              base = str(proxy.get("name") or f"node-{index}")
              name = base
              suffix = 2
              while name in seen:
                  name = f"{base} ({suffix})"
                  suffix += 1
              proxy["name"] = name
              seen.add(name)
              names.append(name)

          config["proxy-groups"] = [{
              "name": "PROXY",
              "type": "select",
              "proxies": names + ["DIRECT"],
          }]
          config["rules"] = ["MATCH,PROXY"]
          with open(path, "w", encoding="utf-8") as f:
              yaml.safe_dump(config, f, allow_unicode=True, sort_keys=False)
          print(f"Added PROXY selector with {len(names)} nodes")
          PY
          grep -q '^proxy-groups:' flclash.yaml
          grep -q '^rules:' flclash.yaml

      - name: Publish updated configuration to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flclash.yaml
          if git diff --cached --quiet; then
            echo "Configuration unchanged"
          else
            git commit -m "chore: update FlClash subscription"
            git push
          fi
